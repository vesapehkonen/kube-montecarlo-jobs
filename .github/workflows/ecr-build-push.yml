name: build-and-push-ecr

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  ECR_REPO_API: "kube-montecarlo-jobs-api"
  ECR_REPO_WORKER: "kube-montecarlo-jobs-worker"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repo variables
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          missing=0

          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then
            echo "::error::Missing repo variable AWS_ROLE_ARN (Settings → Secrets and variables → Actions → Variables)."
            missing=1
          fi

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::Missing repo variable AWS_REGION (example: us-west-2)."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "One or more required variables are missing. Failing workflow."
            exit 1
          fi

          echo "All required variables are set."

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ env.ECR_REPO_API }}
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_URI="$REGISTRY/$REPO"

          echo "Pushing API image to: $IMAGE_URI"
          docker build -t "$IMAGE_URI:sha-$GIT_SHA" -t "$IMAGE_URI:latest" -f backend/Dockerfile.api .
          docker push "$IMAGE_URI:sha-$GIT_SHA"
          docker push "$IMAGE_URI:latest"

      - name: Build, tag, and push Worker image
        shell: bash
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ env.ECR_REPO_WORKER }}
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse --short HEAD)"
          IMAGE_URI="$REGISTRY/$REPO"

          echo "Pushing Worker image to: $IMAGE_URI"
          docker build -t "$IMAGE_URI:sha-$GIT_SHA" -t "$IMAGE_URI:latest" -f backend/Dockerfile.worker .
          docker push "$IMAGE_URI:sha-$GIT_SHA"
          docker push "$IMAGE_URI:latest"
