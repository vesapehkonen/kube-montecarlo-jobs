name: deploy-app

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SQS_QUEUE_NAME: kube-montecarlo-jobs-queue
      DDB_TABLE_NAME: kube-montecarlo-jobs
      APP_MODE: aws

    steps:
      - uses: actions/checkout@v4

      # ---------- AWS AUTH ----------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compute SQS queue URL
        id: sqs
        run: |
          set -euo pipefail
          SQS_QUEUE_URL="$(aws sqs get-queue-url \
            --region "${AWS_REGION}" \
            --queue-name "${SQS_QUEUE_NAME}" \
            --query QueueUrl \
            --output text)"
          echo "queue_url=${SQS_QUEUE_URL}" >> "$GITHUB_OUTPUT"
          
      # ---------- DISCOVER EC2 ----------
      - name: Find EC2 public IP
        id: ec2
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=kube-montecarlo-jobs" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          test "$IP" != "None"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # ---------- SSH SETUP ----------
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.ec2.outputs.ip }}" >> ~/.ssh/known_hosts

      # ---------- CONFIGMAP (SQS + DDB) ----------
      - name: Generate ConfigMap on node
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SQS_QUEUE_NAME: kube-montecarlo-jobs-queue
          DDB_TABLE_NAME: kube-montecarlo-jobs
          APP_MODE: aws
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ steps.ec2.outputs.ip }} \
            "AWS_REGION=$AWS_REGION \
             SQS_QUEUE_URL='${{ steps.sqs.outputs.queue_url }}' \
             DDB_TABLE_NAME=$DDB_TABLE_NAME \
             APP_MODE=$APP_MODE \
             bash -s" <<'EOS'
          set -e

          kubectl create namespace demo-app --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n demo-app create configmap app-config \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=SQS_QUEUE_URL="$SQS_QUEUE_URL" \
            --from-literal=DDB_TABLE_NAME="$DDB_TABLE_NAME" \
            --from-literal=APP_MODE="$APP_MODE" \
            --dry-run=client -o yaml | kubectl apply -f -
          EOS

      - name: Create/Update ECR imagePullSecret (OIDC role)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_PASS=$(aws ecr get-login-password --region "$AWS_REGION")

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ubuntu@${{ steps.ec2.outputs.ip }} bash -s <<EOS
          set -e
          kubectl create namespace demo-app --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n demo-app create secret docker-registry ecr-pull \
            --docker-server=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com \
            --docker-username=AWS \
            --docker-password='${ECR_PASS}' \
            --dry-run=client -o yaml | kubectl apply -f -
          EOS
          
      # ---------- APPLY MANIFESTS ----------
      - name: Apply Kubernetes manifests
        run: |
          scp -i ~/.ssh/id_ed25519 -r k8s/aws-ec2 ubuntu@${{ steps.ec2.outputs.ip }}:/home/ubuntu/aws-ec2
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ steps.ec2.outputs.ip }} bash -s <<'EOS'
          set -e
          kubectl apply -f /home/ubuntu/aws-ec2/00-namespace.yaml
          kubectl apply -f /home/ubuntu/aws-ec2/20-api.yaml
          kubectl apply -f /home/ubuntu/aws-ec2/30-worker.yaml
          EOS

      # ---------- BUILD IMAGE URIS ----------
      - name: Build ECR image URIs
        id: images
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "api=${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com//kube-montecarlo-jobs-api:latest" >> $GITHUB_OUTPUT
          echo "worker=${ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com//kube-montecarlo-jobs-worker:latest" >> $GITHUB_OUTPUT

      # ---------- UPDATE IMAGES ----------
      - name: Update images
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ steps.ec2.outputs.ip }} bash -s <<'EOS'
          set -e
          kubectl -n demo-app set image deployment/api api=${{ steps.images.outputs.api }}
          kubectl -n demo-app set image deployment/worker worker=${{ steps.images.outputs.worker }}
          EOS

      # ---------- ROLLOUT CHECK ----------
      - name: Wait for rollout
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ steps.ec2.outputs.ip }} bash -s <<'EOS'
          kubectl -n demo-app rollout status deployment/api
          kubectl -n demo-app rollout status deployment/worker
          EOS
